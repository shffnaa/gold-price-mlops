global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend model_frontend
    bind *:5001
    default_backend model_replicas

backend model_replicas
    balance roundrobin
    option httpchk GET /ping
    http-check expect status 200
    server-template model 3 model-serving:8080 check resolvers docker init-addr libc,none
